<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1e3557;
  --blue: #3981ca;
  --lime: #dbe56c;
  --white: #ffffff;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-400: #94a3b8;
  --gray-600: #475569;
  --gray-800: #1e293b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--gray-50);
  color: var(--gray-800);
  font-family: 'Figtree', sans-serif;
  min-height: 100vh;
}
.topbar {
  background: var(--navy);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar h1 {
  font-family: 'Sora', sans-serif;
  color: var(--white);
  font-size: 1.25rem;
  font-weight: 600;
}
.topbar a {
  color: var(--lime);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
}
.topbar a:hover { text-decoration: underline; }
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 24px;
}
h2 {
  font-family: 'Sora', sans-serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 24px;
}
.archive-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.archive-item {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.archive-item:hover {
  border-color: var(--blue);
  box-shadow: 0 2px 8px rgba(57,129,202,0.1);
}
.archive-date {
  font-family: 'Sora', sans-serif;
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--navy);
}
.archive-label {
  font-size: 0.85rem;
  color: var(--gray-400);
  margin-top: 2px;
}
.arrow {
  color: var(--blue);
  font-size: 1.25rem;
}
.footer {
  text-align: center;
  padding: 40px 24px;
  color: var(--gray-400);
  font-size: 0.8rem;
}
</style>
</head>
