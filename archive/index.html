<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Counsel — Intelligence Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Figtree:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1e3557;
  --blue: #3981ca;
  --lime: #dbe56c;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-alt: #f0f2f5;
  --border: #e2e5ea;
  --border-light: #eceef2;
  --text: #1a1e26;
  --text-secondary: #4a5568;
  --text-muted: #8892a4;
  --text-inverse: #ffffff;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(30,53,87,0.06);
  --shadow-md: 0 4px 12px rgba(30,53,87,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Figtree', system-ui, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(30,53,87,0.97);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--lime);
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-brand {
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-inverse);
  letter-spacing: -0.01em;
}
.topbar-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.2); }
.topbar-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  font-weight: 400;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-link {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  padding: 4px 14px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--r-sm);
  transition: all 0.15s;
}
.topbar-link:hover { background: rgba(255,255,255,0.1); color: var(--text-inverse); }

.page {
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 32px 80px;
}
.page-header { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.ph-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 6px;
  font-weight: 500;
}
.ph-title {
  font-family: 'Sora', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.ph-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

.archive-list { list-style: none; }
.archive-item {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  margin-bottom: 10px;
  overflow: hidden;
  transition: all 0.2s;
  position: relative;
}
.archive-item::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--lime);
  opacity: 0;
  transition: opacity 0.2s;
}
.archive-item:hover { box-shadow: var(--shadow-md); }
.archive-item:hover::after { opacity: 1; }
.archive-item a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  text-decoration: none;
  color: inherit;
}
.ai-left {}
.ai-date {
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 3px;
}
.ai-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.ai-arrow {
  font-size: 18px;
  color: var(--text-muted);
  transition: transform 0.2s, color 0.2s;
}
.archive-item:hover .ai-arrow { transform: translateX(4px); color: var(--blue); }

.footer {
  text-align: center;
  padding: 24px 0;
  border-top: 1px solid var(--border);
  margin-top: 32px;
}
.footer-text { font-size: 11px; color: var(--text-muted); }
.footer-text a { color: var(--blue); text-decoration: none; }

@media (max-width: 768px) {
  .page { padding: 24px 16px 60px; }
  .topbar { padding: 0 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-brand">Team Counsel</span>
    <div class="topbar-sep"></div>
    <span class="topbar-sub">Knowledge Engine — Archive</span>
  </div>
  <div class="topbar-right">
    <a href="../" class="topbar-link">← Current Report</a>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div class="ph-eyebrow">Intelligence Archive</div>
    <div class="ph-title">Past Reports</div>
    <div class="ph-sub">Daily intelligence reports generated by the Team Counsel Knowledge Engine</div>
  </div>

  <ul class="archive-list">
    <li class="archive-item">
      <a href="2026-09-27.html">
        <div class="ai-left">
          <div class="ai-date">27 September 2026</div>
          <div class="ai-meta">Daily Intelligence Report</div>
        </div>
        <span class="ai-arrow">→</span>
      </a>
    </li>
  </ul>

  <div class="footer">
    <div class="footer-text">
      Team Counsel Knowledge Engine ·
      <a href="../">Current Report</a> ·
      <a href="https://github.com/johnmathew-alt/gtmengine" target="_blank">GitHub</a>
    </div>
  </div>
</div>

</body>
</html>
